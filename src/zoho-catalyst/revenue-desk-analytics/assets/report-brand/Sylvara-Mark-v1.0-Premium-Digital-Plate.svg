<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Sylvara Mark v1.0 - Premium Digital Plate</title>
  <desc id="desc">Sylvara premium digital mark on a white circular plate.</desc>
  <defs>
    <radialGradient id="plate" cx="34%" cy="27%" r="78%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.70" stop-color="#FEFFFF"/>
      <stop offset="1" stop-color="#F8FBFC"/>
    </radialGradient>
    <linearGradient id="teal" x1="18%" y1="12%" x2="84%" y2="88%">
      <stop offset="0" stop-color="#0DB2C9"/>
      <stop offset="0.48" stop-color="#00A6C1"/>
      <stop offset="1" stop-color="#0092AC"/>
    </linearGradient>
    <linearGradient id="graphite" x1="20%" y1="12%" x2="82%" y2="90%">
      <stop offset="0" stop-color="#1B2226"/>
      <stop offset="0.50" stop-color="#090C0E"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <clipPath id="plate-clip">
      <circle cx="250" cy="250" r="234.4"/>
    </clipPath>
    <filter id="mark-shadow" x="-18%" y="-20%" width="140%" height="145%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.05" result="contact-blur"/>
      <feOffset in="contact-blur" dx="1.15" dy="1.55" result="contact-offset"/>
      <feFlood flood-color="#24363F" flood-opacity="0.20" result="contact-color"/>
      <feComposite in="contact-color" in2="contact-offset" operator="in" result="contact"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.65" result="ambient-blur"/>
      <feOffset in="ambient-blur" dx="1.90" dy="2.45" result="ambient-offset"/>
      <feFlood flood-color="#24363F" flood-opacity="0.075" result="ambient-color"/>
      <feComposite in="ambient-color" in2="ambient-offset" operator="in" result="ambient"/>
      <feMerge>
        <feMergeNode in="ambient"/>
        <feMergeNode in="contact"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="250" cy="250" r="235" fill="url(#plate)"/>
  <circle cx="250" cy="250" r="234.5" fill="none" stroke="#DCE7EA" stroke-width="0.9" stroke-opacity="0.68"/>
