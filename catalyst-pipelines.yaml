version: 1

jobs:
  approve:
    type:
      type-name: approval
      type-variables:
        reviewers:
          - << env.DEPLOY_APPROVER_EMAIL >>
        message: Approve the reviewed Form 2 controller revision for the existing Retell Catalyst Development target.
  deploy_form2_development:
    steps:
      - |
        set +x
        printf '%s\n' 'BLOCKED: Form 2 Development deployment requires a verified native secret binding.' >&2
        exit 1

stages:
  - name: approval
    jobs:
      - approve
  - name: development
    jobs:
      - deploy_form2_development
