version: 1

jobs:
  approve:
    type:
      type-name: approval
      type-variables:
        reviewers:
          - << env.DEPLOY_APPROVER_EMAIL >>
        message: Approve the reviewed Form 2 controller revision for the existing Retell Catalyst Development target.
  deploy_form2_development:
    steps:
      - |
        set +x
        /usr/bin/env -i \
          PATH="$PATH" \
          PROJECT_ID='<< env.PROJECT_ID >>' \
          CATALYST_ORG='<< env.CATALYST_ORG >>' \
          CATALYST_TOKEN='<< env.CATALYST_TOKEN >>' \
          APPROVED_SOURCE_REVISION='<< env.APPROVED_SOURCE_REVISION >>' \
          bash --noprofile --norc src/zoho-catalyst/form2-controller/scripts/deploy-development.sh

stages:
  - name: approval
    jobs:
      - approve
  - name: development
    jobs:
      - deploy_form2_development
