name: Repo Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: repo-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safety-scan:
    name: Public repository safety scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact public commit without credentials
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMIT_SHA" in
            (*[!0-9a-f]*|'') echo "Invalid commit SHA" >&2; exit 1 ;;
          esac
          test "${#COMMIT_SHA}" -eq 40
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 --no-tags origin "$COMMIT_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          git remote remove origin

      - name: Verify hosted Python baseline
        run: >-
          python3 -c
          "import sys; actual=sys.version_info[:2];
          assert actual == (3, 12), f'expected Python 3.12, got {actual}'"

      - name: Scan tracked files
        run: python3 tools/safety/pre-commit-safety-check.py

  python-tests:
    name: Safety regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact public commit without credentials
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMIT_SHA" in
            (*[!0-9a-f]*|'') echo "Invalid commit SHA" >&2; exit 1 ;;
          esac
          test "${#COMMIT_SHA}" -eq 40
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 --no-tags origin "$COMMIT_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          git remote remove origin

      - name: Verify hosted Python baseline
        run: >-
          python3 -c
          "import sys; actual=sys.version_info[:2];
          assert actual == (3, 12), f'expected Python 3.12, got {actual}'"

      - name: Install hash-pinned test dependency
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          --target .ci-deps
          -r tools/safety/requirements.txt

      - name: Run regression tests
        run: PYTHONPATH=.ci-deps python3 -m unittest discover -s tools/safety/tests -p 'test_*.py' -v

      - name: Install the verified Node.js baseline
        env:
          NODE_ARCHIVE_SHA256: 14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647
          NODE_VERSION: 24.19.0
        shell: bash
        run: |
          set -euo pipefail
          archive="node-v${NODE_VERSION}-linux-x64.tar.xz"
          install_dir="$RUNNER_TEMP/node"
          archive_path="$RUNNER_TEMP/$archive"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive_path" \
            "https://nodejs.org/download/release/v${NODE_VERSION}/$archive"
          printf '%s  %s\n' "$NODE_ARCHIVE_SHA256" "$archive_path" \
            | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xJf "$archive_path" --strip-components=1 -C "$install_dir"
          printf '%s\n' "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Install exact gateway dependencies without lifecycle scripts
        run: >-
          npm ci --ignore-scripts --no-audit --no-fund
          --prefix src/zoho-catalyst/billing-webhook-gateway

      - name: Install exact CRM-Billing orchestrator dependencies without lifecycle scripts
        run: >-
          npm ci --ignore-scripts --no-audit --no-fund
          --prefix src/zoho-catalyst/crm-billing-orchestrator/functions/crm_billing_orchestrator

      - name: Install exact Form 1 controller dependencies without lifecycle scripts
        run: >-
          npm ci --ignore-scripts --no-audit --no-fund
          --prefix src/zoho-catalyst/form1-controller/functions/form1_assisted_controller

      - name: Install exact Form 2 controller dependencies without lifecycle scripts
        run: >-
          npm ci --ignore-scripts --no-audit --no-fund
          --prefix src/zoho-catalyst/form2-controller/functions/form2_controller

      - name: Validate exact Retell resolver package lock
        run: >-
          npm ci --ignore-scripts --no-audit --no-fund
          --prefix src/zoho-catalyst/retell-inbound-resolver

      - name: Install exact Retell free-test dependencies without lifecycle scripts
        run: >-
          npm ci --ignore-scripts --no-audit --no-fund
          --prefix src/zoho-catalyst/retell-free-test/functions/retell_free_test

      - name: Install exact Retell retry dependencies without lifecycle scripts
        run: >-
          npm ci --ignore-scripts --no-audit --no-fund
          --install-links
          --prefix src/zoho-catalyst/retell-free-test/functions/retell_free_test_retry

      - name: Audit production gateway dependencies
        run: >-
          npm audit --omit=dev --audit-level=moderate
          --prefix src/zoho-catalyst/billing-webhook-gateway

      - name: Audit production CRM-Billing orchestrator dependencies
        run: >-
          npm audit --omit=dev --audit-level=moderate
          --prefix src/zoho-catalyst/crm-billing-orchestrator/functions/crm_billing_orchestrator

      - name: Audit production Form 1 controller dependencies
        run: >-
          npm audit --omit=dev --audit-level=moderate
          --prefix src/zoho-catalyst/form1-controller/functions/form1_assisted_controller

      - name: Audit production Form 2 controller dependencies
        run: >-
          npm audit --omit=dev --audit-level=moderate
          --prefix src/zoho-catalyst/form2-controller/functions/form2_controller

      - name: Audit Retell resolver production dependencies
        run: >-
          npm audit --omit=dev --audit-level=moderate
          --prefix src/zoho-catalyst/retell-inbound-resolver

      - name: Audit Retell free-test production dependencies
        run: >-
          npm audit --omit=dev --audit-level=moderate
          --prefix src/zoho-catalyst/retell-free-test/functions/retell_free_test

      - name: Audit Retell retry production dependencies
        run: >-
          npm audit --omit=dev --audit-level=moderate
          --prefix src/zoho-catalyst/retell-free-test/functions/retell_free_test_retry

      - name: Run Billing gateway checks and tests
        run: npm run ci --prefix src/zoho-catalyst/billing-webhook-gateway

      - name: Run CRM-Billing orchestrator checks and tests
        run: >-
          npm run ci
          --prefix src/zoho-catalyst/crm-billing-orchestrator/functions/crm_billing_orchestrator

      - name: Run Form 1 controller checks and tests
        run: npm run ci --prefix src/zoho-catalyst/form1-controller/functions/form1_assisted_controller

      - name: Run Form 2 controller checks and tests
        run: npm run ci --prefix src/zoho-catalyst/form2-controller/functions/form2_controller

      - name: Run Retell resolver checks and tests
        run: npm run ci --prefix src/zoho-catalyst/retell-inbound-resolver

      - name: Run Retell free-test checks and tests
        run: npm run ci --prefix src/zoho-catalyst/retell-free-test/functions/retell_free_test

      - name: Run Retell retry checks and tests
        run: npm run ci --prefix src/zoho-catalyst/retell-free-test/functions/retell_free_test_retry

      - name: Run the canonical verifier on Linux
        shell: pwsh
        env:
          PYTHONPATH: .ci-deps
        run: ./tools/verify.ps1 -Mode Quick -PythonPath (Get-Command python3).Source
