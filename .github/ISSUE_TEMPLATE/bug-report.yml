name: Bug report
description: Report a reproducible non-security defect without private data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include secrets, caller or client data, production payloads, recordings, transcripts, phone numbers, or security vulnerabilities. Use private vulnerability reporting for security issues.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the defect using sanitized or synthetic data only.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible example and remove private values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks already run
      description: List exact commands or manual checks, if any.
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed all secrets, credentials, PII, private documents, recordings, transcripts, and production payloads.
          required: true
